name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Install from PyPI rather than the local ../vgi-python path used for
      # `uv run` during development, so CI is self-contained.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install vgi-python "fastembed>=0.3" pyarrow pytest
          uv pip install -e . --no-deps

      # Pre-warm the fastembed cache so the model download happens once, here,
      # rather than inline during the first test (and so the model-gated tests run).
      - name: Warm the embedding model cache
        run: uv run --no-sync python -c "from vgi_embed import models; models.get_model(None); models.get_model('BAAI/bge-base-en-v1.5')"

      - name: Run tests
        run: uv run --no-sync pytest

  # The SQL suite (test/sql/*.test) through the published haybarn-unittest and the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starter template): stdio (DuckDB spawns the worker per
  # connection), launch (DuckDB starts it once on an AF_UNIX socket and pools
  # connections) and http (the worker serves --http).
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.0rc11"
      # Pin fastembed's model cache to a fixed path so the warm step, the worker
      # processes, and actions/cache all agree on where the ONNX model lives.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-${{ runner.os }}-bge-small-and-base-en-v1.5

      - name: Warm the embedding model cache
        run: uv run --no-sync python -c "from vgi_embed import models; models.get_model(None); models.get_model('BAAI/bge-base-en-v1.5')"

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/.venv/bin/vgi-embed-worker" \
          HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      # uv otherwise picks the newest CPython (3.15), which lacks wheels for native deps.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      # Build the worker exactly as the integration job does, so the linter
      # introspects the same catalog the SQL E2E suite runs against.
      - name: Install the worker (from the lockfile, with the http extra)
        run: uv sync --frozen --extra http --python 3.14

      # Warm the embedding model so the worker boots without an inline download
      # when the linter spawns it for catalog introspection.
      - name: Warm the embedding model cache
        run: uv run --no-sync python -c "from vgi_embed import models; models.warm_up()"

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Lint the worker from the synced project venv, NOT `uv run embed_worker.py`:
          # the PEP-723 inline-script env re-resolves its own deps and can cache a
          # stale vgi-python whose older catalog schema trips a false mismatch.
          location: ".venv/bin/python embed_worker.py"
          fail-on: info

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # uv otherwise picks the newest CPython (3.15), which lacks wheels for native deps.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install tooling
        run: |
          uv venv
          uv pip install vgi-python "fastembed>=0.3" pyarrow ruff mypy pydoclint
          uv pip install -e . --no-deps

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy vgi_embed

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_embed
